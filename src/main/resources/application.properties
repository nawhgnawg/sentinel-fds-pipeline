spring.application.name=fds

# Kafka 브로커 주소 설정
spring.kafka.bootstrap-servers=localhost:9092

# 내부에 선언된 컨슈머 그룹 아이디
spring.kafka.consumer.group-id=fds-alert-group

# Producer 직렬화 설정 (문자열 전송)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# 금융권 수준의 안정성 (데이터 유실 방지)
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3

# 내장 톰캣 서버 포트
server.port=8080

# Discord Webhook URL
discord.webhook.url=https://discord.com/api/webhooks/1516979440931045477/d9kiRrzB9axx0-yundsn3WnZn1KoRvwZaLH-ljGBT-9Q5S74JtkAJ9Na4TlMfQZ9oJiP

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379

# ----------------------------------------
# 🌟 Kafka SASL/PLAIN 보안 인증 설정 추가
# ----------------------------------------
# 1. 외부망 통신이므로 SASL_PLAINTEXT 프로토콜 사용
spring.kafka.security.protocol=SASL_PLAINTEXT

# 2. 아이디/비밀번호 기반의 PLAIN 메커니즘 사용
spring.kafka.properties.sasl.mechanism=PLAIN

# 3. 우리가 명부에 적어둔 스프링 전용 계정(spring / spring-secret) 제출
spring.kafka.properties.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="spring" password="spring-secret";

# 🌟 Consumer가 기동될 때, 카프카에 쌓인 가장 옛날 데이터부터 빠짐없이 읽어오도록 강제하는 옵션
spring.kafka.consumer.auto-offset-reset=earliest